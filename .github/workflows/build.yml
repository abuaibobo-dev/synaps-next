name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v3.0.0）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/gradle/wrapper/gradle-wrapper.properties', 'client/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        working-directory: client/android
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          VERSION="${VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          [ -z "$PATCH" ] && PATCH=0
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          APP_VERSION_NAME="$VERSION" APP_VERSION_CODE="$CODE" ./gradlew assembleRelease --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          cp client/android/app/build/outputs/apk/release/app-release.apk "dist/Synaps-$TAG.apk"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" "dist/Synaps-$TAG.apk" \
            --repo "${{ github.repository }}" \
            --title "Synaps $TAG" \
            --notes "GitHub Actions 自动构建" || \
          gh release upload "$TAG" "dist/Synaps-$TAG.apk" --repo "${{ github.repository }}" --clobber

      - name: Print direct link
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          echo "直链: https://github.com/${{ github.repository }}/releases/download/$TAG/Synaps-$TAG.apk"
